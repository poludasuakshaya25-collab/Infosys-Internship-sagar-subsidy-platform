spring.application.name=Subsidy-platform-test

# SERVER - LOCAL + RENDER
server.port=${PORT:8081}

# AIVEN MYSQL
spring.datasource.url=jdbc:mysql://${DB_HOST}:${DB_PORT}/${DB_NAME}?sslMode=REQUIRED
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}

# JPA / HIBERNATE
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# UPLOAD LIMITS
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=50MB

# SAGAR APPLICATION / OFFICER ONBOARDING
sagar.app.base-url=${SAGAR_APP_BASE_URL:http://localhost:8081}
sagar.officer.invitation-hours=24

# REAL EMAIL
sagar.mail.enabled=true

# LOGIN / REGISTRATION OTP
sagar.otp.expiry-minutes=5
sagar.otp.max-attempts=5
sagar.otp.resend-seconds=60
sagar.otp.dev-display=false
